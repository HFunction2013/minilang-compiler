name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout compiler
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout boot toolchain (sibling)
        uses: actions/checkout@v4
        with:
          repository: HFunction2013/minilang-boot
          path: minilang-boot

      - name: Install LLVM + build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang build-essential make

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: Build boot compiler (Unix)
        if: runner.os != 'Windows'
        working-directory: minilang-boot
        run: make

      - name: Build boot compiler (Windows, MSVC)
        if: runner.os == 'Windows'
        working-directory: minilang-boot
        shell: bash
        run: cmake -B build && cmake --build build --config Release

      - name: Add boot binary to PATH (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "${{ github.workspace }}/minilang-boot" >> $GITHUB_PATH

      - name: Full test suite (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          MINILANG_BOOT: ${{ github.workspace }}/minilang-boot/minilang
          MINILANG: ${{ github.workspace }}/minilang-boot/minilang
          MINILANG_DIR: ${{ github.workspace }}
          LLVM_DIR: ${{ runner.os == 'macOS' && '/opt/homebrew/opt/llvm' || '' }}
        run: |
          set -e
          bash vm_test.sh
          bash bootstrap_test.sh
          bash full_selfhost_test.sh
          bash ext_test.sh
          echo "=== every tests/*.mil through the boot VM ==="
          for f in tests/*.mil; do
            echo "--- $f ---"
            minilang run "$f"
          done

      - name: VM smoke over tests/*.mil (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MINILANG_BOOT: ${{ github.workspace }}/minilang-boot/build/Release/minilang.exe
          MINILANG_DIR: ${{ github.workspace }}
        run: |
          set -e
          BIN=minilang-boot/build/Release/minilang.exe
          for f in tests/*.mil; do
            echo "--- $f ---"
            "$BIN" run "$f"
          done
