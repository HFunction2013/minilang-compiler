name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: ubuntu-latest
            cc: g++
          - os: macos-latest
            cc: clang
          - os: windows-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Checkout compiler
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout boot toolchain (sibling)
        uses: actions/checkout@v4
        with:
          repository: HFunction2013/minilang-boot
          ref: ${{ github.head_ref || github.ref_name }}
          path: minilang-boot

      - name: Install C toolchain (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make clang g++

      - name: Build boot compiler (Unix)
        if: runner.os != 'Windows'
        working-directory: minilang-boot
        run: make

      - name: Build boot compiler (Windows, MSVC)
        if: runner.os == 'Windows'
        working-directory: minilang-boot
        shell: bash
        run: cmake -B build && cmake --build build --config Release

      - name: Full test suite (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          MINILANG_BOOT: ${{ github.workspace }}/minilang-boot/minilang
          MINILANG: ${{ github.workspace }}/minilang-boot/minilang
          MINILANG_DIR: ${{ github.workspace }}
          CC: ${{ matrix.cc }}
        run: bash full_test.sh

      - name: Full test suite (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MINILANG_BOOT: ${{ github.workspace }}/minilang-boot/build/Release/minilang.exe
          MINILANG_DIR: ${{ github.workspace }}
          CC: ${{ matrix.cc }}
          # Shared-library precompile model on Windows still uses the Unix
          # .so flags; skip that one suite until the Windows DLL path lands.
          SKIP_EXT: 1
        run: bash full_test.sh
