name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: GNU gcc, GNU C++ driver (g++), and clang.
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: g++
          - os: ubuntu-latest
            cc: clang
          # macOS: Apple/LLVM clang and Homebrew GCC (versioned alias g++-15).
          # MSVC/cl is Windows-only and has no macOS build.
          - os: macos-latest
            cc: clang
          - os: macos-latest
            cc: g++-15
          # Windows: MSVC cl and the LLVM clang (MSVC ABI target). MinGW g++
          # is deferred: its extension DLL needs the host exe's MinGW import
          # library, which the CMake build does not yet emit; tracked in #6.
          - os: windows-latest
            cc: cl
          - os: windows-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Checkout compiler
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout boot toolchain (sibling)
        uses: actions/checkout@v4
        with:
          repository: HFunction2013/minilang-boot
          ref: ${{ github.head_ref || github.ref_name }}
          path: minilang-boot

      - name: Install GNU toolchain (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ clang

      - name: Set up MSVC environment (Windows, self-contained)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          set >> "%GITHUB_ENV%"

      - name: Build boot compiler (Unix)
        if: runner.os != 'Windows'
        working-directory: minilang-boot
        run: make

      - name: Build boot compiler (Windows, MSVC)
        if: runner.os == 'Windows'
        working-directory: minilang-boot
        shell: bash
        run: cmake -B build && cmake --build build --config Release

      - name: Full test suite (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          MINILANG_BOOT: ${{ github.workspace }}/minilang-boot/minilang
          MINILANG: ${{ github.workspace }}/minilang-boot/minilang
          MINILANG_DIR: ${{ github.workspace }}
          CC: ${{ matrix.cc }}
        run: bash full_test.sh

      - name: Full test suite (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MINILANG_BOOT: ${{ github.workspace }}/minilang-boot/build/Release/minilang.exe
          MINILANG_DIR: ${{ github.workspace }}
          CC: ${{ matrix.cc }}
        run: bash full_test.sh
